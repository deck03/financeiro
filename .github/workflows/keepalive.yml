name: keepalive-supabase

# Chama a rota /api/cron/keepalive 3x por dia (a cada 8 horas) para o
# Supabase gratuito não pausar por inatividade. Também pode ser disparado
# na mão: aba Actions > keepalive-supabase > Run workflow.
on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar a rota de keepalive
        run: |
          curl --fail --show-error --silent --retry 3 --retry-delay 15 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://financeiro-swart-nine.vercel.app/api/cron/keepalive"
