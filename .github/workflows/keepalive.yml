name: Keepalive Supabase

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping direto no Supabase (independe do Vercel)
        run: |
          code=$(curl -s -o /tmp/sb.txt -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/organizations?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase respondeu $code (esperado 200)"
            cat /tmp/sb.txt
            exit 1
          fi

      - name: Ping na rota do sistema (leitura + escrita)
        if: ${{ !cancelled() }}
        run: |
          code=$(curl -s -o /tmp/app.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://financeiro-swart-nine.vercel.app/api/cron/keepalive")
          echo "Vercel HTTP $code"
          cat /tmp/app.txt
          if [ "$code" != "200" ] || ! grep -q '"ok":true' /tmp/app.txt; then
            echo "::error::Rota keepalive falhou (HTTP $code ou sem ok:true)"
            exit 1
          fi
